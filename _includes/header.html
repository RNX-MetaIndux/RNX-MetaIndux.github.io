{% assign image = "images/background.jpg" %}
{% assign logo = "images/logowhite.svg" %}

<header
  class="background"
  style="--image: url('{{ image | relative_url | uri_escape }}')"
  data-dark="true"
>
  <a href="{{ "/" | relative_url }}" class="home" aria-label="Home">
    <span class="logo">
      <img src="{{ logo | relative_url | uri_escape }}" alt="RNX-MetaIndux">
    </span>
  </a>

  <input class="nav-toggle" type="checkbox" aria-label="show/hide nav">

  <nav>
    {% assign pages = site.pages
      | where_exp: "page", "page.nav"
      | sort: "nav.order"
    %}
    {% for page in pages %}
      {% if page.nav %}
        <a
          href="{{ page.dir | relative_url | uri_escape }}"
          data-tooltip="{{ page.nav.tooltip | xml_escape }}"
        >
          {{ page.title }}
        </a>
      {% endif %}
    {% endfor %}
  </nav>

  <input
    type="checkbox"
    class="dark-toggle"
    data-tooltip="Dark mode"
    aria-label="toggle dark mode"
  >
</header>
