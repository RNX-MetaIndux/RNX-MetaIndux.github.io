name: on-schedule
run-name: on schedule

on:
  schedule:
    # weekly
    - cron: "0 0 * * 1"

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  citations-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Citation auto-sync disabled
        run: echo "Remote citation auto-sync is disabled; using committed _data/citations.yaml."
