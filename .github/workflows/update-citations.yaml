name: update-citations
run-name: update citations

on:
  workflow_call:
    inputs:
      open-pr:
        type: boolean
    outputs:
      changed:
        value: ${{ jobs.update-citations.outputs.changed }}

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-citations:
    runs-on: ubuntu-latest
    outputs:
      changed: "false"
    steps:
      - name: Citation auto-sync disabled
        run: |
          echo "Remote citation auto-sync is disabled."
          echo "The site uses the committed _data/citations.yaml file."
