- doi: 10.48550/arXiv.2608.26780
  slug: ai-control-scientist
  title: 'AI Control Scientist: LLM-driven Agentic System for Automated Control Design'
  type: Preprint
  summary: 这项研究面向工业控制系统设计中依赖专家经验与反复手动调参的问题，提出由大语言模型驱动的多智能体系统。系统将自然语言需求转化为工程约束，生成控制器结构与可执行代码，再借助数值优化和闭环仿真调整参数。论文通过多类动态系统的设计实验，考察自动设计流程的成功率与优化效率。
  sources:
  - label: arXiv record
    url: https://arxiv.org/abs/2608.26780
  - label: arXiv full text
    url: https://arxiv.org/html/2608.26780v1
  editorial_note: 当前为预印本；不将仿真实验结果写成真实工业现场部署能力，也不使用原摘要中的首创性宣传。作者组合与现有团队成员一致，原稿未列单位。
  publication_date: '2026-08-27'
  publication_date_label: arXiv 首次提交
  key_points:
  - 任务建模、控制器设计和参数调优由三个智能体分工完成，并通过验证反馈迭代。
  - 根据系统动态特性组织控制设计依据，将语言推理与数值求解结合。
  - 在稳定、不稳定、含时延和高阶系统等测试场景中，与自动控制设计基线比较。
- doi: 10.48550/arXiv.2608.10941
  slug: physdgm
  title: Physics-informed Diffusion Generative Model for Time-Series Data Synthesis in Dynamic Systems
  type: Preprint
  summary: 这项研究针对航空发动机、电池和化工过程等动态系统中时间序列数据获取成本高、样本有限的问题，提出将物理规律逐步嵌入扩散生成过程的方法。模型在逆向扩散步骤中引入约束，使合成序列与系统规律相协调。论文通过多个工业数据集，评估生成质量及其对剩余寿命预测、健康状态估计和故障诊断的作用。
  sources:
  - label: arXiv record
    url: https://arxiv.org/abs/2608.10941
  - label: arXiv full text
    url: https://arxiv.org/html/2608.10941v1
  editorial_note: 当前为预印本。原稿明确列出王海腾、祝云飞、李奕慷、董家宝、任磊的北航单位及邮箱；中文说明不承诺所有工业场景均获同样增益。
  publication_date: '2026-08-11'
  publication_date_label: arXiv 首次提交
  key_points:
  - 在逆向扩散的各个步骤嵌入物理规律，关注生成轨迹的物理一致性。
  - 结合物理约束训练与条件采样，为数据有限的动态系统合成时间序列。
  - 围绕发动机、电池及化工过程数据，评估合成数据对多类预测与诊断任务的影响。
- doi: 10.48550/arXiv.2607.14510
  slug: vlt
  title: 'VLT: A Vision-Language-Time Series Multimodal Foundation Model for Industrial Intelligence'
  type: Preprint
  summary: 这项研究面向工业设备预测与健康管理，将时间序列、频谱图像和文本知识纳入统一的多模态模型。研究以频谱作为连续信号与语言语义之间的连接，结合时序专家混合结构和跨模态梯度协调机制，学习不同信息之间的互补关系。论文在多个工业数据集上考察预测效果，以及少样本、噪声和模态缺失条件下的表现。
  sources:
  - label: arXiv record
    url: https://arxiv.org/abs/2607.14510
  - label: arXiv full text
    url: https://arxiv.org/html/2607.14510v1
  editorial_note: 当前为预印本。原稿说明已提交 IEEE，但没有确认录用；不赋予具体期刊。王海腾、晏景衡和任磊的北航署名可在正文核对。
  publication_date: '2026-07-16'
  publication_date_label: arXiv 首次提交
  key_points:
  - 以时序专家混合结构刻画不同时间动态，并共同学习频谱视觉信息与文本知识。
  - 通过以时间序列为中心的梯度对齐，缓解多模态联合训练中的优化冲突。
  - 实验涵盖回归、故障分类及跨域评估，并分析噪声与模态不完整的影响。
